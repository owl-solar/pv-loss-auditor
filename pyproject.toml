[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-loss-auditor"
version = "0.1.0"
description = "Diagnoses PV plant underperformance: expected vs actual generation, KPIs and a loss waterfall in kWh and USD."
readme = "README.md"
# Tested with Python 3.13 (Windows, CI on Linux). Direct dependencies only, pinned.
requires-python = ">=3.13"
dependencies = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pyarrow==26.0.0",          # parquet read/write
    "pvlib==0.16.1",            # PVWatts DC / inverter, temperature and solar position
    "pvanalytics==0.2.2",       # data QA, clear-sky detection
    "rdtools==3.2.1",           # YoY degradation, SRR soiling
    "scikit-learn==1.9.1",      # Isolation Forest on residuals
    "pyyaml==6.0.3",            # configs/system_<id>.yaml
    "matplotlib==3.11.2",       # used internally by RdTools
]

[project.optional-dependencies]
data = [
    "boto3==1.43.118",          # anonymous (unsigned) access to the public OEDI S3 bucket
    "requests==2.34.2",         # Open-Meteo / price data HTTP APIs
]
app = [
    "plotly==7.1.0",
    "streamlit==1.66.1",
]
notebooks = [
    "jupyterlab==4.6.4",
    "ipykernel==7.4.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "pre-commit==4.7.0",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pythonpath` lets the tests import the package from src/ and `scripts` from the root
# even without `pip install -e .`.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110                  # the code base was written at about this width
target-version = "py313"
extend-exclude = ["notebooks"]     # notebooks keep their outputs; their logic lives in src/

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, SIM simplifications that keep the code readable.
select = ["E", "W", "F", "I", "B", "UP"]
# E501: the formatter wraps code; long comments and strings (explanations of methodology) stay readable as they are.
ignore = [
    "E501",
    # B905: several zips deliberately stop at the shorter input (palette x columns, names x groups);
    # strict=True would raise, strict=False would only restate the current behaviour.
    "B905",
]

[tool.ruff.lint.isort]
known-first-party = ["pv_loss_auditor", "scripts", "conftest", "common"]

[tool.mypy]
python_version = "3.13"
files = ["src/pv_loss_auditor"]
# Every function must be annotated; bodies are checked. Third-party packages without type information
# (pvlib, pvanalytics, rdtools, boto3 ...) are treated as Any instead of failing the run.
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
