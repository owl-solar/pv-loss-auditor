# PVDAQ system 9069 (Simon Solar Farm). Source: 2023-solar-data-prize/9069_OEDI/metadata/
# 9069_system_metadata.json and csv/systems_20250729.csv, unless stated otherwise.
# "assumed, to be verified in QA" = not in metadata or inconsistent; do not treat as fact.

system:
  id: 9069
  name: Simon Solar Farm
  location: Social Circle, GA
  latitude: 33.6762
  longitude: -83.676
  elevation_m: 330.1
  # Metadata gives only timezone_code: 5. Site is in America/New_York. Timestamp clocks differ
  # per file: see `clock` below.
  timezone: America/New_York

capacity:
  # Sum over the module table: 25 992 x 295 W + 103 398 x 300 W = 38 687.04 kW.
  dc_kw: 38687
  # 40 inverters x 825 kW. 825 kW is given only for inverters 1-5.
  # The summary CSV labels 33 000 as dc_capacity_kW; it matches AC, not DC.
  ac_kw: 33000
  ac_kw_status: verified in QA (notebook 01, section 3) - every inverter clips at 825-830 kW

mount:
  type: fixed
  tilt_deg: 20
  azimuth_deg: 180
  # NREL flag "Wrong mounting config identified" not supported: POA nRMSE 4.9 % fixed vs 36 %
  # tracker on clear days; best grid point 25/180 (4.6 %), 20/180 kept as metadata value.
  status: verified in QA (notebook 01, section 3)
  # Alternative geometry used ONLY to test the NREL flag, not for station selection.
  tracker_hypothesis:
    axis_tilt_deg: 0
    axis_azimuth_deg: 180
    max_angle_deg: 60
    backtrack: true
    gcr: 0.4
    status: rejected in QA (POA nRMSE 34-36 %)

modules:
  # Metadata field is named "nameplate capacity(kW)" but values are clearly W.
  - type: multi-Si
    quantity: 25992
    pnom_w: 295
    isc_a: 8.48
    voc_v: 45.9
    gamma_pmp_pct_per_c: -0.28   # unusual for multi-Si; open question, check in Phase 2
  - type: multi-Si
    quantity: 103398
    pnom_w: 300
    isc_a: 8.53
    voc_v: 46.08
    gamma_pmp_pct_per_c: -0.45

inverters:
  count: 40
  # Strings x 19 modules: 20 x 272 + 20 x 68 = 129 200 modules vs 129 390 in the module table.
  # NOT supported by the data: clear-day energy is equal across inverters (0.88-1.05 of the
  # median, groups 1-20 / 21-40: 1.005 / 0.981), so DC per inverter is about equal. Kept only as
  # the metadata record; do not use.
  string_groups_status: contradicted by QA (notebook 01, section 3)
  string_groups:
    - {ids: "1-20", modules_per_string: 19, strings: 272}
    - {ids: "21-40", modules_per_string: 19, strings: 68}
  ac_kw:
    - {ids: "1-5", ac_kw: 825, status: metadata}
    - {ids: "6-40", ac_kw: 825, status: "verified in QA: clipping level 825-830 kW"}

data:
  timestamp_column: measured_on      # naive "YYYY-MM-DD HH:MM:SS", time zone unknown
  # 2019 rejected: meter data gap 2019-04-04 07:00 .. 2020-03-26 06:55, irradiance at 15-min steps.
  sample_months: ["2020-06", "2020-12"]
  max_download_mb: 100               # CLAUDE.md: ask before any download above this
  out_dir: data/raw/pvdaq/9069_sample
  header_cache: data/raw/pvdaq/9069_sample/headers.json
  # Wide CSV files (one row per 5-min step, one column per channel).
  # channels: raw column name in the CSV -> project column name (units in the name).
  files:
    irradiance:
      key: pvdaq/2023-solar-data-prize/9069_OEDI/data/9069_irradiance_data.csv
      channels:
        "pyranometer_(class_a)_12_ghi_irradiance_(w/m2)_o_150231": ghi_pyr12_wm2
        "pyranometer_(class_a)_02a_poa_irradiance_(w/m2)_o_150233": poa_pyr02a_wm2
        "pyranometer_(class_a)_08_poa_irradiance_(w/m2)_o_150242": poa_pyr08_wm2
        "reference_cell_02_poa_irradiance_(w/m2)_o_150238": poa_ref02_wm2
    environment:
      key: pvdaq/2023-solar-data-prize/9069_OEDI/data/9069_environment_data.csv
      channels:
        "thermocouple_02_back-of-module_temperature_(sensor_2)_(c)_o_150257": t_mod_tc02s2_c
        "thermocouple_08_back-of-module_temperature_(sensor_1)_(c)_o_150266": t_mod_tc08s1_c
    electrical_ac:
      key: pvdaq/2023-solar-data-prize/9069_OEDI/data/9069_electrical_ac.csv
      channels:
        "inverter_01_ac_power_(kw)_inv_150953": p_ac_inv01_kw
        "inverter_10_ac_power_(kw)_inv_150962": p_ac_inv10_kw
        "inverter_30_ac_power_(kw)_inv_150982": p_ac_inv30_kw
    meter:
      key: pvdaq/2023-solar-data-prize/9069_OEDI/data/9069_meter_data.csv
      channels:
        "meter_1_ac_power_(kw)_meter_151040": p_ac_meter1_kw
        "meter_2_ac_power_(kw)_meter_151053": p_ac_meter2_kw

# Full-period coverage map (src/coverage.py): point reads at evenly spaced byte positions.
coverage:
  points_per_month: 20
  random_seed: 9069                    # stratified random offsets, reproducible
  # Daylight = sun elevation above this; 15 deg keeps samples in daylight even if the
  # assumed time zone is off by 1 h.
  min_sun_elevation_deg: 15
  local_tz_assumed: America/New_York   # daylight classification only; verified later in QA
  min_gap_days: 1                      # report time gaps longer than this
  workers: 8                           # parallel HTTP requests
  out_dir: data/processed/9069_coverage
  # Bytes per point read: must hold one partial + one complete row (about 2x the longest row).
  read_bytes: {irradiance: 512, environment: 2048, electrical_ac: 6144, meter: 640}
  # Regex patterns on raw column names: channels to evaluate in each file.
  channel_patterns:
    irradiance: ["poa_irradiance", "ghi_irradiance"]
    environment: ["back-of-module_temperature"]
    electrical_ac: ["^inverter_(01|10|30)_ac_power_\\(kw\\)"]
    meter: ["^meter_[12]_ac_power_\\(kw\\)"]

# Full analysis period, downloaded month by month (src/pvdaq.py --period).
# Each file is read from `start` to its end; every month goes to its own parquet file.
period:
  start: "2020-05"            # first month; the end of each file is the end of the period
  approved_mb: 1250           # user approved ~1.2 GB (estimate 1215 MB); plan aborts above this
  chunk_mb: 4                 # size of one HTTP range request
  retries: 5                  # per chunk, with growing pauses (2, 4, 8, ... s)
  order: [irradiance, meter, environment, electrical_ac]   # biggest file last
  out_dir: data/raw/pvdaq/9069_period
  # Channel selection: regex on the raw column name -> project name. Groups in the regex fill
  # the {0}, {1} placeholders. A rule that matches nothing, or two raw columns that get the same
  # name, stops the run. Raw values are saved as they are (sentinels like -297 are kept; QA
  # decides), timestamps stay naive as in the source.
  rules:
    irradiance:                # all 14 channels: the file is small and sensor agreement is a QA check
      - {pattern: '^pyranometer_\(class_a\)_12_ghi_irradiance_\(w/m2\)_o_\d+$', name: "ghi_pyr12_wm2"}
      - {pattern: '^pyranometer_\(class_a\)_(\w+)_poa_irradiance_\(w/m2\)_o_\d+$', name: "poa_pyr{0}_wm2"}
      - {pattern: '^reference_cell_(\d{2})_poa_irradiance_\(w/m2\)_o_\d+$', name: "poa_ref{0}_wm2"}
    meter:                     # total AC power of both meters (meter 1 until 2019, meter 2 since 2020)
      - {pattern: '^meter_([12])_ac_power_\(kw\)_meter_\d+$', name: "p_ac_meter{0}_kw"}
    environment:
      - {pattern: '^thermocouple_(\d{2})_back-of-module_temperature_\(sensor_(\d)\)_\(c\)_o_\d+$', name: "t_mod_tc{0}s{1}_c"}
      - {pattern: '^weather_station_(\d{2})_ambient_temperature_\(sensor_(\d)\)_\(c\)_o_\d+$', name: "t_amb_ws{0}s{1}_c"}
      - {pattern: '^wind_sensor_\w+_wind_speed_\(m/s\)_o_\d+$', name: "wind_speed_ms"}
      - {pattern: '^wind_sensor_\w+_wind_direction_o_\d+$', name: "wind_dir_deg"}
      # Inverter heatsink temperature: separates clipping from temperature derating (Phase 3)
      - {pattern: '^inverter_pad_(\d{2})_temperature_heatsink_\(c\)_inv_\d+$', name: "t_hs_inv{0}_c"}
    electrical_ac:             # AC power of all 40 inverters
      - {pattern: '^inverter_(\d{2})_ac_power_\(kw\)_inv_\d+$', name: "p_ac_inv{0}_kw"}

# Clock of each file's naive timestamps (src/timealign.py), found in notebook 01, section 2,
# from the daily profile vs the sun position (clear days, r > 0.97), not from the time axis.
# Label - UTC: UTC-5 in winter, UTC-4 in summer, but the switch dates differ per file.
clock:
  rules:
    irradiance: eu_dst_utc-5          # 0 of 315 clear days contradict EU dates; 23 contradict US
    environment: eu_dst_utc-5         # module temperature has no 1 h jump against irradiance
    electrical_ac: America/New_York   # +1 h against irradiance in every EU/US window
    meter: America/New_York           # same as electrical_ac
  # Inverter heatsink temperatures (environment file) correlate too weakly with irradiance
  # (r 0.3-0.45) to identify their clock. Not used until checked separately.
  unverified_columns: ["^t_hs_inv"]
  reference_channel: poa_ref01_wm2   # irradiance channel used as time reference
  clear_day_min_r: 0.97

# Geometry and sensor checks on clear days (src/geometry.py, notebook 01, section 3).
geometry_check:
  ghi_channel: ghi_pyr12_wm2          # clear-sky detection; GHI exists only until 2022-03
  ghi_until: "2022-03-31"
  poa_channels: [poa_ref01_wm2, poa_ref04_wm2, poa_ref10_wm2]   # measured POA = their mean
  compare_channels: [poa_pyr02b_wm2]  # class-A pyranometer, for sensor agreement only
  clearsky_window_min: 30             # detect_clearsky window for 5-min data (see geometry.py)
  clear_day_min_fraction: 0.9         # clear day: >= 90 % of daylight steps flagged clear
  daylight_min_elevation_deg: 10      # daylight for the clear-day fraction
  fit_min_elevation_deg: 15           # POA fit: skip low sun (AOI and horizon effects)
  albedo: 0.2
  grid_tilts_deg: [0, 5, 10, 15, 20, 25, 30, 35, 40]
  grid_azimuths_deg: [150, 160, 170, 180, 190, 200, 210]

# Cleaning (src/clean.py, notebook 01, section 4). Values are kept as measured (in UTC); problems
# are marked in boolean flag columns, so each later phase chooses its own filter. Exceptions:
# logger placeholders (<= -250) become NaN, small negative night irradiance becomes 0 (flagged).
clean:
  out_dir: data/processed/9069
  report: reports/9069_qa_report.md
  keep:                              # regex on project column names, per source file
    irradiance: ['^ghi_pyr12_wm2$', '^poa_ref(01|04|10)_wm2$', '^poa_pyr02b_wm2$']
    # Thermocouple 03 s1 is excluded: it reads 45-80 C at night and up to 1138 C for the whole
    # period (stuck at 1138 from 2023-07); not a module temperature. Its coverage looked fine
    # in section 1 only because that test checks placeholders, not plausibility.
    environment: ['^t_mod_tc(01s1|06s1|10s1)_c$', '^t_amb_ws(01|03|06|10)s1_c$', '^wind_']
    electrical_ac: ['^p_ac_inv\d{2}_kw$']
    meter: ['^p_ac_meter2_kw$']
  stale_window_steps: 6              # 6 x 5 min = 30 min of identical values = stuck
  stale_min_elevation_deg: 5         # stuck test in daylight only (zeros at night are real)
  ac_clip_fraction: 0.98             # AC >= 98 % of rating = clipping plateau, not stuck
  ac_max_fraction: 1.05              # AC above 105 % of rating = out of range
  ac_min_kw: -10                     # AC below this = out of range (small negative = night self-use)
  poa_cs_factor: 1.3                 # POA above 1.3 x clear-sky POA + offset = out of range
  poa_cs_offset_wm2: 50              # (cloud enhancement reaches about +30 %)
  irradiance_min_day_wm2: -5         # daytime irradiance below this = out of range
  night_offset_floor_wm2: -20        # night irradiance in [-20, 0) = zero offset -> set to 0
  # Physical range of the other sensors, [min, max]; outside = flag_range (regex on column name).
  # Wind shows 3276.7 = 32767 / 10, a 16-bit overflow placeholder.
  sensor_limits:
    '^t_mod_': [-30, 90]
    '^t_amb_': [-30, 50]
    '^wind_speed': [0, 60]
    '^wind_dir': [0, 360]

# Expected-yield model (src/model.py, notebook 02). Built from nameplate data and explicit
# design losses, NOT calibrated on the measurements: whatever the plant loses beyond these
# (soiling, degradation, sensor bias, outages) must show up in the residual.
model:
  # Plane-of-array input: mean of the valid reference cells. Cells 04 / 10 agree within 2 %;
  # cell 01 reads 3.5-5.4 % low and is not used (notebook 01, section 3).
  poa_channels: [poa_ref04_wm2, poa_ref10_wm2]
  # Back-of-module thermocouples (03 is excluded in the cleaning). Mean of the valid ones.
  t_mod_channels: [t_mod_tc01s1_c, t_mod_tc06s1_c, t_mod_tc10s1_c]
  t_amb_channel: t_amb_ws01s1_c       # ambient, station 01 (the others hold values 20-27 % of the time)
  # Cell temperature = back-of-module + delta_t x G / 1000 (Sandia, open rack, glass / polymer
  # back sheet). The thermocouple sits behind the cell, the junction is a little hotter.
  delta_t_cell_c: 3
  # No modelled fallback for missing thermocouples: measured T exists on 97.7 % of daylight
  # steps, a Faiman fallback (pvlib defaults, wind 1 m/s) would fill only 0.08 % more and reads
  # +5.8 C above the thermocouples (median of POA > 200 W/m2). A calibrated thermal model is
  # needed in Phase 4 (Open-Meteo), not here.
  # Temperature coefficient: DC-weighted mean over the module table (-0.416 %/C). The 295 W
  # modules with -0.28 are 20 % of the DC. Measured on the plant (notebook 02, section 3):
  # -0.35 ... -0.43 %/C, no inverter group at -0.28.
  gamma_source: nameplate_weighted
  # DC design losses in percent, combined multiplicatively by pvlib.pvsystem.pvwatts_losses.
  # Soiling, shading, snow, availability and age are set to 0 on purpose: they are what the
  # audit measures. Typical PVsyst-like values for a ground-mount plant, to be reviewed.
  dc_losses_pct: {lid: 1.5, mismatch: 2.0, wiring: 1.5, connections: 0.5, nameplate_rating: 1.0}
  # PVWatts inverter. Nominal efficiency of a central inverter of this class and vintage (to be
  # reviewed, the data cannot separate it from DC losses). Output is clipped at the AC rating.
  inverter: {eta_inv_nom: 0.98, eta_inv_ref: 0.9637}

# KPI definitions (src/kpi.py, notebook 02).
kpi:
  meter_channel: p_ac_meter2_kw      # plant meter (sum of inverters / meter = 1.022)
  # Inverter-step with POA above this and valid AC counts toward availability.
  availability_poa_min_wm2: 50
  # Inverter is "down" if its AC power is below this fraction of its rating at such a step.
  down_p_ac_fraction: 0.01
  # Day counts toward daily KPIs if this share of daylight inverter-steps is valid.
  day_min_coverage: 0.9
  # Cell drift threshold relative to the pyranometer; above it a correction is discussed.
  drift_threshold_pct_per_year: 0.5

# Loss waterfall (src/losses.py, notebook 03). Decisions with the user: sequential order,
# meter-based end point, daily meter reconciliation for data-channel loss.
losses:
  # Sum of inverters / meter 2 in 2020-2022 (outages real, channels complete): transformer and
  # cable losses after the inverters. Used to bring the meter to inverter-AC level.
  inv_to_meter: 1.022
  # A local day is a "channel-loss day" if sum(inverter AC) / (meter x inv_to_meter) is below
  # 1 - tolerance: the meter sees energy that the inverter channels do not report. 2020-2022
  # daily ratios scatter within about +-3 % (to be checked in notebook 03).
  channel_tolerance: 0.03
  # Design DC-loss totals for the sensitivity table (the base 6.34 % is an assumption).
  dc_loss_sensitivity_pct: [4.0, 6.34, 8.0]

# Electricity price for valuing lost energy (src/prices.py, Phase 3).
# Connection type (decided with the user from satellite images and the data): utility-scale,
# behind step-up transformers, next to a high-voltage substation (sum of inverters / meter 2 =
# 1.02 = transformer losses). Georgia has no ISO / RTO, so there is no LMP (gridstatus) and the
# CLAUDE.md branch "plants outside ISO regions" applies. No regional wholesale series was found
# at EIA (its hubs do not cover the Southeast; the Georgia figure there is retail).
price:
  source: >
    Georgia Power Company 2025 Avoided Cost and Solar Avoided Cost Projections, filed with the
    Georgia PSC on 2025-06-27 (filing #223157, dockets 4822 and 16573), workbook sheet
    "Proposed_AC Projections (Int)". https://psc.ga.gov/search/facts-document/?documentId=223157
  file: data/raw/prices/georgia_power_2025_avoided_cost_projections.zip   # 249 kB, not committed
  sheet_number: 2
  technology: Solar Ground-Mounted Fixed Tilt     # matches 9069; "Profile Weighted Hours"
  year: 2026                                      # first projection year, 30.19 USD/MWh
  sensitivity_fraction: 0.30                      # reported band: base x 0.7 ... base x 1.3
  # Limits, to be stated wherever a USD figure is shown: (1) a PROJECTION for 2026-2045 applied
  # flat to the audit period 2020-05 ... 2023-11 (realised wholesale prices in 2021-2022 were
  # higher because of gas prices); (2) the utility's avoided cost, not the plant's PPA price,
  # which is unknown. The ranking of loss causes in kWh does not depend on the price.
  # Repowering Planner (project 2) can use the whole 2026-2045 curve from the same file.

# Degradation and soiling with RdTools (src/degradation.py, notebook 04).
degradation:
  # A day needs at least this share of its usable inverter-steps running (not down).
  min_running_share: 0.5
  # Days with less plane-of-array insolation are dropped: the daily ratio is noisy on dark days
  # (short window, low-light and AOI effects dominate). Value to be checked in notebook 04.
  min_daily_poa_kwh_m2: 2.0

# Anomaly detection on residuals (src/anomalies.py, notebook 05). Decisions with the user:
# relative residual, normalised by the peer median; daily and 5-min feature levels.
anomalies:
  # Steps used for residuals: POA above this (low light is noisy and not linear in the model).
  min_poa_wm2: 200
  # Steps with expected AC above this share of the rating are skipped (clipping hides losses).
  max_expected_fraction: 0.9
  # A peer median needs at least this many running inverters at that step.
  min_peers: 10
  # A day-inverter row needs at least this many valid steps (24 x 5 min = 2 h).
  min_day_steps: 24

  # SYNTHETIC string faults (src/synthetic_faults.py). Injected into the real AC series, always
  # labelled synthetic. A fault of k strings multiplies the AC of one inverter by (1 - k / N).
  synthetic:
    seed: 9069
    # DERIVED, not metadata (its 272 / 68 strings are contradicted by the data): inverter DC
    # 967.2 kW / (19 modules x 0.300 kW) = 169.7 strings, so one string = 0.59 % of the inverter.
    strings_per_inverter: 170
    # k = number of lost strings. 1-3 = below the expected detection limit (~3 strings);
    # 40 strings (-23.5 %) is the size of the real inv30 event of 2020-10 / 11.
    levels_strings: [1, 2, 3, 5, 10, 20, 40]
    events_per_level: 12
    window_days: 21            # a fault lasts 21 local days, abrupt onset, constant size
    min_valid_share: 0.9       # share of window days with a daily feature for that inverter
    buffer_days: 15            # distance from excluded periods (the own-norm window is +-30 d)
    # Real events must not be mixed with injected labels. Plant-wide: every inverter is excluded.
    exclude_plant:
      - {start: "2020-12-12", end: "2020-12-18", reason: "plant-wide stop, 26 inverters down"}
      - {start: "2021-01-02", end: "2021-01-11", reason: "10 inverters down, partly false zeros"}
      - {start: "2022-05-23", end: "2022-05-24", reason: "plant-wide stop"}
      - {start: "2022-10-20", end: "2022-10-25", reason: "plant-wide stop, 34 inverters down"}
    # One inverter only: real events found in the daily residuals (cause unknown).
    exclude_inverter:
      - {inverter: p_ac_inv30_kw, start: "2020-10-24", end: "2020-11-04", reason: "real, about -25 %"}
      - {inverter: p_ac_inv13_kw, start: "2021-11-19", end: "2021-12-15", reason: "real, rel 0.1-0.25"}
      - {inverter: p_ac_inv09_kw, start: "2022-07-29", end: "2022-07-29", reason: "real, rel 0.57"}
      - {inverter: p_ac_inv16_kw, start: "2023-09-21", end: "2023-09-21", reason: "real, rel 0.79"}
      - {inverter: p_ac_inv20_kw, start: "2020-06-18", end: "2020-06-18", reason: "rel 1.39 on 35 steps"}
